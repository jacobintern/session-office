<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Office</title>
<meta name="description" content="A pixel-art office for your Claude Code sessions: the README, and the link to the user manual.">
<!-- The README itself, fetched from the repository so this page never drifts from it;
     the manual's link is the one thing this page adds. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root { --bg: #fbfaf7; --fg: #23211d; --muted: #6b665c; --line: #e4e0d6; --accent: #b4532a; --card: #fff4e8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1a18; --fg: #ece8e0; --muted: #a39d92; --line: #343129; --accent: #f08a5a; --card: #2a2420; } }
  :root[data-theme="dark"] { --bg: #1b1a18; --fg: #ece8e0; --muted: #a39d92; --line: #343129; --accent: #f08a5a; --card: #2a2420; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  .manual { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin: 0 0 24px; color: var(--fg); text-decoration: none; }
  .manual b { color: var(--accent); font-size: 1.15em; }
  .manual span { display: block; color: var(--muted); font-size: .95em; }
  .lang { float: right; margin-top: 2px; } .lang a { color: var(--muted); margin-left: 12px; } .lang a[aria-current] { color: var(--fg); font-weight: 600; text-decoration: none; }
  article h1 { font-size: 1.8em; margin: .2em 0 .4em; } article h2 { font-size: 1.3em; margin-top: 1.6em; border-bottom: 1px solid var(--line); padding-bottom: .2em; }
  article a { color: var(--accent); } article pre { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: .9em; }
  article code { background: var(--card); padding: .1em .3em; border-radius: 4px; font-size: .92em; } article pre code { background: none; padding: 0; }
  article table { border-collapse: collapse; width: 100%; font-size: .95em; } article th, article td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  article blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 14px; color: var(--muted); }
  article img { max-width: 100%; }
  .note { color: var(--muted); font-size: .9em; }
</style>
</head>
<body>
<main>
  <nav class="lang" id="lang"><a href="#zh">中文</a><a href="#en">English</a></nav>
  <a class="manual" href="manual/"><b>使用手冊 → manual/</b><span>圖文版操作手冊（繁體中文）：安裝、每一個畫面、常見問題。User manual, picture-led, in Traditional Chinese.</span></a>
  <article id="readme"><p class="note">讀取 README…</p></article>
  <p class="note">Source: <a href="https://github.com/jacobintern/session-office">github.com/jacobintern/session-office</a></p>
</main>
<script>
(() => {
  const RAW = 'https://raw.githubusercontent.com/jacobintern/session-office/main/';
  const el = document.getElementById('readme');
  const pick = () => location.hash === '#en' ? 'en' : location.hash === '#zh' ? 'zh' : (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  async function show() {
    const lang = pick(), file = lang === 'zh' ? 'README.zh-TW.md' : 'README.md';
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
    for (const a of document.querySelectorAll('#lang a')) a.toggleAttribute('aria-current', a.hash === '#' + lang);
    try {
      const r = await fetch(RAW + file, { cache: 'no-cache' });
      if (!r.ok) throw new Error(r.status);
      let md = await r.text();
      // links between the two READMEs stay on this page; relative links go to the repository
      md = md.replace(/\]\(README\.zh-TW\.md\)/g, '](#zh)').replace(/\]\(README\.md\)/g, '](#en)');
      el.innerHTML = marked.parse(md, { baseUrl: 'https://github.com/jacobintern/session-office/blob/main/' });
      for (const a of el.querySelectorAll('a[href]')) {
        const h = a.getAttribute('href');
        if (!/^(https?:|#)/.test(h)) a.href = 'https://github.com/jacobintern/session-office/blob/main/' + h;
      }
      // images are relative to the repository root, which this site does not serve
      for (const img of el.querySelectorAll('img[src]')) {
        const src = img.getAttribute('src');
        if (!/^(https?:|data:)/.test(src)) img.src = RAW + src;
      }
    } catch (e) {
      el.innerHTML = '<p class="note">README 讀不到（' + e.message + '）。請到 <a href="https://github.com/jacobintern/session-office">GitHub</a> 看。</p>';
    }
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
